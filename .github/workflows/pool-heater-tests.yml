name: Pool heater tests

on:
  push:
    paths:
      - "pool-heater/**"
      - ".github/workflows/pool-heater*.yml"
  pull_request:
    paths:
      - "pool-heater/**"
      - ".github/workflows/pool-heater*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pool-heater
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pool-heater/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
