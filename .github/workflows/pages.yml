name: Deploy to GitHub Pages

# Publishes public/ as a static site. The app needs no server unless you want
# automatic photo identification, so this is enough to run it from your phone.

on:
  push:
    branches:
      - main
      - claude/plant-care-app-je7fya
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement turns Pages on for the repo rather than making you find the
      # setting by hand. It needs Pages to be available on the account: free
      # plans only get Pages on *public* repos.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
