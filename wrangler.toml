# Cloudflare Worker configuration.
#
# One Worker serves both halves of the app: the static files in public/ come
# from the assets binding, and anything under /api/ is handled by worker.js.
# Same origin, so there is no CORS to think about.
#
# Keeping this in the repo means `npx wrangler deploy` works with no dashboard
# settings to hunt for — only the two secrets have to be added by hand.

name = "garden-library"
main = "worker.js"

# nodejs_compat gives the Anthropic library the Node built-ins it expects.
# The date must be 2024-09-23 or later for the fuller Node support.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

# Record what the Worker does, so a failure that happened five minutes ago on a
# phone in a garden can still be looked at afterwards. Without this, the
# dashboard only offers a live stream you have to be watching at the moment it
# breaks — which is no use for something intermittent.
[observability]
enabled = true
